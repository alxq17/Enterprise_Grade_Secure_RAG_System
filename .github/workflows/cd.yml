name: VeriRAG Continuous Deployment (CD)

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: "Deploy Production Stack"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Announcement
        run: |
          echo "Triggering automated deployment of VeriRAG to target environment..."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Validate Production Compose
        run: |
          echo "Validating Docker Compose production configuration..."
          docker compose -f docker/docker-compose.yml config --quiet
          echo "Compose configuration is valid."
