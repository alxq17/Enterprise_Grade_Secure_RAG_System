name: verirag

networks:
  verirag-net:
    driver: bridge

volumes:
  qdrant_storage:
  hf_cache:
  prometheus_data:
  grafana_data:

services:
  # 1. Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: verirag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__ENABLE_STATIC_CONTENT=true
    networks:
      - verirag-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 2. FastAPI Application
  fastapi:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: verirag-fastapi
    restart: unless-stopped
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      COLLECTION_NAME: ${COLLECTION_NAME:-enterprise_docs}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DOMAIN_SIMILARITY_THRESHOLD: ${DOMAIN_SIMILARITY_THRESHOLD:-0.35}
    volumes:
      - ../src:/app/src
      - hf_cache:/app/.cache/huggingface
    networks:
      - verirag-net
    depends_on:
      qdrant:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fastapi.rule=PathPrefix(`/`)"
      - "traefik.http.routers.fastapi.entrypoints=web"
      - "traefik.http.services.fastapi.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s

  # 3. Traefik Reverse Proxy
  traefik:
    profiles: ["full"]
    image: traefik:v3.0
    container_name: verirag-traefik
    restart: unless-stopped
    ports:
      - "8080:80"     # Web routing entrypoint
      - "8088:8080"   # Traefik Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../infrastructure/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../infrastructure/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - verirag-net

  # 4. Prometheus Time-Series DB
  prometheus:
    profiles: ["full"]
    image: prom/prometheus:v2.52.0
    container_name: verirag-prometheus
    restart: unless-stopped
    volumes:
      - ../infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - verirag-net

  # 5. Grafana Visualization Dashboard
  grafana:
    profiles: ["full"]
    image: grafana/grafana:11.0.0
    container_name: verirag-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../infrastructure/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../infrastructure/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../infrastructure/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - verirag-net