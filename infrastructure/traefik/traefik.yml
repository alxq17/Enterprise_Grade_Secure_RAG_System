global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  dashboard: true
  insecure: true

entryPoints:
  web:
    address: ":80"
  traefik:
    address: ":8080"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: "verirag-net"
  file:
    filename: "/etc/traefik/dynamic.yml"
    watch: true

log:
  level: "INFO"

accessLog: {}
